[package]
name = "seggwat"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SeggWat public board API types, a cached server-side client and end-user token signing"
readme = "README.md"
keywords = ["seggwat", "feedback", "roadmap", "changelog", "feature-voting"]

[features]
default = []
# Server-side reads (cached), Markdown rendering and end-user token signing.
# Leave off in wasm builds; the types and UI helpers need nothing.
client = ["dep:reqwest", "dep:hmac", "dep:sha2", "dep:base64", "dep:markdown", "dep:thiserror"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# rustls, not native-tls: keeps server builds off OpenSSL.
reqwest = { version = "0.13.1", default-features = false, features = ["rustls"], optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
thiserror = { version = "2.0", optional = true }
# Changelog bodies are Markdown. markdown-rs escapes raw HTML and drops
# dangerous link protocols by default, so the output is safe to embed.
markdown = { version = "1.0.0", optional = true }
