[package]
name = "seggwat-dioxus"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SeggWat feature voting, roadmap and changelog as Dioxus components"
readme = "README.md"
keywords = ["seggwat", "dioxus", "roadmap", "changelog", "feature-voting"]
include = ["src/**", "assets/**", "safelist.html", "README.md", "Cargo.toml"]

[dependencies]
seggwat = { workspace = true }
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "document", "asset"] }

[dev-dependencies]
serde_json = { workspace = true }
dioxus-ssr = "0.7.10"
